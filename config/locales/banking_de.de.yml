      new:
        title: Kontoauszug hochladen
        files: Dateien (XML oder ZIP)
        submit: Hochladen
        hint_format: >-
          Unterstützt werden Kontoauszüge im Format camt.052 und camt.053 (z. B. Sparkasse:
          „XML (CAMT V8 – gebuchte Umsätze)“). Mehrere Dateien oder ein ZIP mit allen
          Tagesdateien können auf einmal hochgeladen werden.
        hint_duplicates: >-
          Bereits importierte Buchungen werden erkannt und übersprungen. Zeiträume dürfen sich
          deshalb überschneiden.
        hint_privacy: >-
          Gespeichert werden nur Zahlungseingänge und Rücklastschriften. Ausgaben werden nicht
          übernommen. Beim Hochladen wird noch nichts gebucht.
