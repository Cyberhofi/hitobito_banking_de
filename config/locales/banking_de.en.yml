        return_reason: Return reason
        payment_information_id: Batch reference
        account: Own account
      candidates:
        title: Suggestions
        none: No matching person found. Please select below.
      allocation_form:
        title: Allocate
        title_return: Allocate returned direct debit
        hint: >-
          Split the amount into people, purposes and years. Several years or people in
          separate rows. Rows without a person are not saved.
        hint_return: >-
          The returned direct debit is booked with a negative amount and undoes the payment
          for the selected year.
        person: Person
        purpose: Purpose
        year: Year
        amount: Amount
        note: Note (optional)
        submit: Save allocation
      ignore_form:
        title: No allocation
