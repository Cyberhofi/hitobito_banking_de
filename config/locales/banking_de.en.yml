        show: Show
      show:
        title: "Booking of %{date}, %{amount}"
        back: Back to the list
        batch_hint: >-
          Direct debit batch: the statement only contains the sum, not the single direct
          debits. This booking cannot be allocated to people here. Please ignore it.
        ignored: Ignored
        processed: "Processed by %{person} at %{time}"
        reopen: Reopen
      details:
        booking_date: Booking date
        amount: Amount
        payer: Payer
        iban: IBAN
        remittance: Remittance information
