      AC04: Account closed
      AC06: Account blocked
      AC13: Invalid account type
      AG01: Direct debit not allowed on this account
      AM04: Insufficient funds
      AM05: Duplicate collection
      BE05: Unknown creditor
      MD01: No mandate
      MD02: Missing or incorrect mandate data
      MD06: Refund requested by the debtor
      MD07: Account holder deceased
      MS02: Refused by the debtor
      MS03: Reason not specified
      SL01: Blocked by the debtor
    statement_import:
