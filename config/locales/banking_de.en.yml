        success: "Booking %{booking} allocated."
      revert:
        success: Allocation taken back.
      ignore:
        success: "Booking %{booking} ignored."
      reopen:
        success: Booking reopened.
      errors:
        not_allocatable: This booking cannot be allocated (anymore).
        no_rows: Please select at least one person.
        not_done: This booking is not allocated.
        not_open: This booking is not open.
        not_ignored: This booking is not ignored.

    statements:
      index:
        title: Statements
        upload: Upload statement
        bookings: Back to bank import
        empty: No statements imported yet.
        period: Period
        account: Account
        opening_balance: Opening balance
        closing_balance: Closing balance
        file: File
        imported: Imported
      new:
        title: Upload statement
        files: Files (XML or ZIP)
        submit: Upload
        hint_format: >-
          Account reports and statements in the formats camt.052 and camt.053 are supported.
          Several files or a ZIP with all daily files can be uploaded at once.
        hint_duplicates: >-
          Bookings already imported are recognized and skipped, so periods may overlap.
        hint_privacy: >-
          Only incoming payments and returned direct debits are stored, no outgoing payments.
          Nothing is booked when uploading.
      create:
        no_file: Please select a file.
        summary: >-
          %{files} file(s) read: %{bookings} new bookings, %{duplicate_bookings} already
          present, %{skipped_entries} not relevant (outgoing payments etc.).
          %{duplicate_reports} statements were already imported.
      gaps:
        latest: "Latest state %{account}: %{date}, balance %{balance}"
        title: Statements may be missing
        gap: "%{account}: the balance does not match between %{after} and %{before}."

    bank_accounts:
      edit:
        title: "Bank account of %{person}"
        mandate: SEPA direct debit mandate
        mandate_hint: >-
          Direct debits can only be collected with a mandate reference and signing date. A
          revoked mandate stays stored for traceability.
        last_return: "Returned direct debit on %{date}: %{reason}"
        clear_return: Done (e.g. new bank account checked)
        destroy: Delete bank account
        destroy_confirm: Delete bank account and mandate of this person?
      update:
        success: Bank account saved.
      destroy:
        success: Bank account deleted.

  people:
